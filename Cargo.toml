[package]
name = "nkgrep"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
description = "Top-n,k ranked code search: trigram index, best-first verify, proven match sets"
license = "Apache-2.0"
repository = "https://github.com/HEKPYTO/NKGREP"
authors = ["HEKPYTO"]
keywords = ["search", "grep", "code-search", "index", "ranking"]
categories = ["command-line-utilities", "text-processing"]
exclude = [
     "bench/",
     "docs/",
     "plans/",
     "outputs/",
     "output/",
     "CHANGELOG.md",
     "AGENTS.md",
     ".worktrees/",
     "*.idx.json",
     "*.idx.bin",
     "corpus*/",
     ".github/",
     ".gitignore",
     ".pre-commit-config.yaml",
     "rust-toolchain.toml",
]

[[bin]]
name = "nkg"
path = "src/main.rs"

[dependencies]
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
rayon = "1"
serde = { version = "1", features = ["derive", "rc"] }
memchr = "2"
serde_json = "1"
libc = "0.2"
memmap2 = "0.9"

[profile.release]
opt-level = 3
# ripgrep 15.0.0 ships full LTO for "small performance improvements" and a
# smaller binary; the scan core we share is built the same way, so matching it
# is free. codegen-units=1 lets LTO actually cross crate boundaries.
lto = "fat"
codegen-units = 1
